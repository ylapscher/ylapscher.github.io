name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # `npm ci` instead of `npm install`: installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart.
      # `npm install` would silently resolve newer versions at build time, which
      # means the deployed artifact might not match what was reviewed and would
      # quietly route around the `overrides` block in package.json.
      - name: Install dependencies
        run: npm ci

      # Blocking gate on what actually reaches a visitor's browser. This must
      # stay clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only. Dev-only tooling (eslint and its glob chain) is never
      # bundled into the static export, so an advisory there cannot affect the
      # deployed site and must not be able to block a deploy.
      - name: Audit all dependencies (advisory)
        run: npm audit || true

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0