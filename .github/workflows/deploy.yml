name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Pages
        uses: actions/configure-pages@1f0c5cde4bc74cd7e1254d0cb4de8d49e9068c7d # v4

      # `npm ci` instead of `npm install`: installs exactly what the lockfile
      # pins and fails if package.json and the lockfile have drifted apart.
      # `npm install` would silently resolve newer versions at build time, which
      # means the deployed artifact might not match what was reviewed and would
      # quietly route around the `overrides` block in package.json.
      - name: Install dependencies
        run: npm ci

      # Blocking gate on what actually reaches a visitor's browser. This must
      # stay clean.
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      # Advisory only. Dev-only tooling (eslint and its glob chain) is never
      # bundled into the static export, so an advisory there cannot affect the
      # deployed site and must not be able to block a deploy.
      - name: Audit all dependencies (advisory)
        run: npm audit || true

      - name: Build with Next.js
        env:
          NEXT_PUBLIC_POSTHOG_KEY: ${{ secrets.NEXT_PUBLIC_POSTHOG_KEY }}
          NEXT_PUBLIC_POSTHOG_HOST: ${{ secrets.NEXT_PUBLIC_POSTHOG_HOST }}
        run: npm run build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: ./out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4