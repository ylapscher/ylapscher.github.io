version: 2

updates:
  # Application dependencies.
  #
  # Grouping matters here: the 42-alert backlog this config was written to prevent
  # was mostly a single stale transitive dependency (axios, via a posthog-node
  # import that nothing used) fanning out into 26 separate alerts. Grouped PRs keep
  # that from arriving as unreviewable noise.
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    versioning-strategy: increase
    groups:
      # Routine patch/minor upgrades land as one reviewable PR.
      production-minor-patch:
        applies-to: version-updates
        dependency-type: "production"
        update-types: ["minor", "patch"]
      development-minor-patch:
        applies-to: version-updates
        dependency-type: "development"
        update-types: ["minor", "patch"]
      # Security fixes are grouped separately so they are never buried behind
      # a routine version bump.
      security:
        applies-to: security-updates
        patterns: ["*"]
    ignore:
      # Major upgrades are deliberate, hand-driven migrations, not review-queue
      # items. Next 16 in particular requires Node >= 20.9 and carries breaking
      # changes, and it does NOT fix any advisory that the 15.5.x line leaves
      # open (16.x still pins the same postcss 8.4.31 and sharp 0.34.x that the
      # `overrides` block in package.json exists to correct).
      - dependency-name: "next"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react"
        update-types: ["version-update:semver-major"]
      - dependency-name: "react-dom"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      # eslint 10 is blocked upstream: eslint-config-next peers on
      # ^7.23.0 || ^8.0.0 || ^9.0.0. Revisit when that range widens.
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]

  # The deploy workflow pins every action to a commit SHA, which is the right
  # call for supply-chain safety but means nothing updates them automatically.
  # This keeps the pins moving instead of silently rotting.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]
